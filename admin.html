<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Admin - Secure</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e1e1e; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; border: 1px solid #333; }
        button { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-angry { background: #300; color: #f44; border: 1px solid #f44; }
        .btn-slurp { background: #030; color: #0f0; border: 1px solid #0f0; }
        .btn-blij { background: #024; color: #08f; border: 1px solid #08f; }
        .btn-speak { background: #fff; color: #000; margin-top: 15px; }
        input { width: 100%; padding: 18px; background: #252525; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 18px; box-sizing: border-box; margin-bottom: 10px; }
        .pw-input { border-color: #ff9500; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Toegang</h3>
        <input type="password" id="pw" class="pw-input" placeholder="Wachtwoord invoeren...">
    </div>

    <div class="card">
        <h3>Emoties</h3>
        <button class="btn-angry" onclick="doAction('emo', 'angry')">Standaard Boos</button>
        <button class="btn-slurp" onclick="doAction('emo', 'slurpen')">Energie Slurpen</button>
        <button class="btn-blij" onclick="doAction('emo', 'super-blij')">Super Blij</button>
    </div>

    <div class="card">
        <h3>Spraak</h3>
        <input type="text" id="t" placeholder="Typ je tekst...">
        <button class="btn-speak" onclick="doAction('speech')">Verstuur Spraak</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function doAction(type, val) {
            const pw = document.getElementById('pw').value;
            // Eerst het wachtwoord naar de database schrijven om de "lock" te openen
            db.ref('password').set(pw).then(() => {
                if(type === 'emo') {
                    db.ref('tablet_emotion').set(val);
                } else {
                    const txt = document.getElementById('t').value;
                    if(txt) {
                        db.ref('tablet_speech').set({ text: txt, time: Date.now() });
                        document.getElementById('t').value = "";
                    }
                }
            }).catch(err => {
                alert("Fout: Wachtwoord onjuist!");
            });
        }
    </script>
</body>
</html>
