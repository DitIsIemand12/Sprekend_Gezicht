<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet Admin - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; width: 90%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 15px; background: #252525; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 18px; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; text-transform: uppercase; }
        
        /* Login Styles */
        #login-screen { display: block; }
        .btn-login { background: #ff9500; color: #000; }

        /* Admin Styles */
        #admin-panel { display: none; }
        .btn-angry { background: #300; color: #f44; border: 1px solid #f44; margin-top: 10px; }
        .btn-slurp { background: #030; color: #0f0; border: 1px solid #0f0; margin-top: 10px; }
        .btn-blij { background: #024; color: #08f; border: 1px solid #08f; margin-top: 10px; }
        .btn-speak { background: #fff; color: #000; margin-top: 20px; }
        h3 { color: #888; font-size: 12px; letter-spacing: 1px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- LOGIN SCHERM -->
    <div id="login-screen" class="card">
        <h2>Systeem Toegang</h2>
        <p>Voer het admin-wachtwoord in:</p>
        <input type="password" id="passInput" placeholder="Wachtwoord...">
        <button class="btn-login" onclick="tryLogin()">Inloggen</button>
    </div>

    <!-- ADMIN PANEEL (Verborgen tot login) -->
    <div id="admin-panel" class="card">
        <h3>Gezicht Toestand</h3>
        <button class="btn-angry" onclick="setEmo('angry')">Boos / Rood</button>
        <button class="btn-slurp" onclick="setEmo('slurpen')">Energie Slurpen</button>
        <button class="btn-blij" onclick="setEmo('super-blij')">Super Blij / Blauw</button>
        
        <h3 style="margin-top:30px;">Spraak</h3>
        <input type="text" id="speechText" placeholder="Typ tekst...">
        <button class="btn-speak" onclick="say()">Verstuur Spraak</button>
        <p id="status" style="font-size: 10px; color: #555; margin-top: 10px;">Ingelogd</p>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentPassword = "";

        function tryLogin() {
            const pw = document.getElementById('passInput').value;
            // Probeer het wachtwoord te schrijven naar de 'auth' node
            db.ref('auth').set(pw).then(() => {
                // Als dit lukt, onthouden we het wachtwoord en tonen het paneel
                currentPassword = pw;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.body.style.height = "auto";
            }).catch(err => {
                alert("Wachtwoord onjuist of geen toegang!");
            });
        }

        function setEmo(emo) {
            // We sturen ALTIJD het wachtwoord mee in de 'auth' node bij elke actie
            db.ref('/').update({
                "auth": currentPassword,
                "tablet_emotion": emo
            });
        }

        function say() {
            const txt = document.getElementById('speechText').value;
            if(txt) {
                db.ref('/').update({
                    "auth": currentPassword,
                    "tablet_speech": { text: txt, time: Date.now() }
                });
                document.getElementById('speechText').value = "";
            }
        }
    </script>
</body>
</html>
