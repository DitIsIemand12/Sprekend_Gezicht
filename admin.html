<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control - iPad</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0c0c0c; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #181818; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 20px; border: 1px solid #333; }
        h3 { margin-top: 0; color: #666; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
        button { width: 100%; padding: 20px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.2s; text-transform: uppercase; }
        .btn-red { background: #330000; color: #ff4444; border: 1px solid #ff4444; }
        .btn-green { background: #002200; color: #00ff00; border: 1px solid #00ff00; }
        .btn-blue { background: #001133; color: #0088ff; border: 1px solid #0088ff; }
        .btn-white { background: #fff; color: #000; margin-top: 15px; }
        input { width: 100%; padding: 20px; background: #222; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 18px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Modus selecteren</h3>
        <button class="btn-red" onclick="setEmo('angry')">Enge Tablet (Boos)</button>
        <button class="btn-green" onclick="setEmo('slurpen')">Energie Slurpen (Groen)</button>
        <button class="btn-blue" onclick="setEmo('super-blij')">Buzz Gered (Super Blij)</button>
    </div>

    <div class="card">
        <h3>Spreken</h3>
        <input type="text" id="t" placeholder="Typ je tekst hier..." autocomplete="off">
        <button class="btn-white" onclick="say()">NU SPREKEN</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        function setEmo(e) { db.ref('tablet_emotion').set(e); }
        function say() {
            const v = document.getElementById('t').value;
            if(v) {
                db.ref('tablet_speech').set({ text: v, time: Date.now() });
                document.getElementById('t').value = "";
            }
        }
        document.getElementById('t').addEventListener('keypress', e => { if(e.key === 'Enter') say(); });
    </script>
</body>
</html>
