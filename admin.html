<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Admin - Dark Mode</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .card { 
            background: #1e1e1e; 
            width: 100%; max-width: 450px; 
            padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        h3 { margin-top: 0; color: #888; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        
        button { 
            width: 100%; padding: 18px; margin: 10px 0; 
            border: none; border-radius: 12px; 
            font-weight: bold; cursor: pointer; 
            font-size: 16px; transition: all 0.2s;
            text-transform: uppercase;
        }
        button:active { transform: scale(0.96); opacity: 0.8; }

        .btn-angry { background: #330000; color: #ff4444; border: 1px solid #ff4444; }
        .btn-slurp { background: #003300; color: #00ff00; border: 1px solid #00ff00; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        .btn-blij { background: #002244; color: #0088ff; border: 1px solid #0088ff; }
        .btn-speak { background: #ffffff; color: #000; margin-top: 15px; }

        input { 
            width: 100%; padding: 18px; 
            background: #252525; border: 1px solid #444; 
            border-radius: 12px; color: #fff; font-size: 18px; 
            box-sizing: border-box; outline: none;
        }
        input:focus { border-color: #0088ff; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Emotie & Actie</h3>
        <button class="btn-angry" onclick="setEmo('angry')">Standaard Boos</button>
        <button class="btn-slurp" onclick="setEmo('slurpen')">Energie Slurpen</button>
        <button class="btn-blij" onclick="setEmo('super-blij')">Super Blij</button>
    </div>

    <div class="card">
        <h3>Spreken</h3>
        <input type="text" id="t" placeholder="Wat moet ik zeggen?" autocomplete="off">
        <button class="btn-speak" onclick="say()">Verstuur Spraak</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function setEmo(e) { db.ref('tablet_emotion').set(e); }
        function say() {
            const v = document.getElementById('t').value;
            if(v) {
                db.ref('tablet_speech').set({ text: v, time: Date.now() });
                document.getElementById('t').value = "";
            }
        }
        // Enter-key ondersteuning
        document.getElementById('t').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') say();
        });
    </script>
</body>
</html>
