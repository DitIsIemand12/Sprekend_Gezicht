<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Controller</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f0f2; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .btn-evil { background: #ff3b30; }
        .btn-happy { background: #007aff; }
        input { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Emotie</h3>
        <button class="btn-evil" onclick="setEmo('angry')">MAAK EVIL (Rood)</button>
        <button class="btn-happy" onclick="setEmo('super-blij')">MAAK BLIJ (Blauw)</button>
    </div>

    <div class="card">
        <h3>Praten</h3>
        <input type="text" id="t" placeholder="Typ wat het karakter zegt...">
        <button style="background: #34c759; color: white; margin-top: 10px;" onclick="say()">STUUR NAAR TV</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function setEmo(e) { 
            db.ref('tablet_emotion').set(e); 
        }

        function say() {
            const v = document.getElementById('t').value;
            if(v) {
                db.ref('tablet_speech').set({ text: v, time: Date.now() });
                document.getElementById('t').value = "";
            }
        }
    </script>
</body>
</html>
