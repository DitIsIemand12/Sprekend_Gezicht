<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evil Remote v3</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: white; padding: 20px; text-align: center; }
        button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .speak-btn { background: #f00; color: white; font-size: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; box-sizing: border-box; border-radius: 10px; margin-bottom: 10px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Remote Control</h1>
    
    <h3>Emotie</h3>
    <div class="grid">
        <button onclick="setEmotion('normal')" style="background: #222; color: white;">Enge Tablet</button>
        <button onclick="setEmotion('angry')" style="background: #600; color: white;">Heel Boos</button>
        <button onclick="setEmotion('super-blij')" style="background: #008cff; color: white;">SUPER BLIJ!</button>
        <button onclick="setEmotion('glitch')" style="background: #555; color: white;">Kortsluiting</button>
    </div>

    <h3>Praten</h3>
    <input type="text" id="txt" placeholder="Typ je tekst...">
    <button class="speak-btn" onclick="stuur()">SPREEK NU</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGvUwRjfQQ0QSh2S4n6mGf8k7sZlBggEs",
            authDomain: "tradingpost-57b20.firebaseapp.com",
            databaseURL: "https://tradingpost-57b20-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tradingpost-57b20",
            storageBucket: "tradingpost-57b20.firebasestorage.app",
            messagingSenderId: "358205969306",
            appId: "1:358205969306:web:3262822209994843fca023"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function setEmotion(emo) {
            db.ref('tablet_emotion').set(emo);
        }

        function stuur() {
            const txt = document.getElementById('txt').value;
            if(txt) {
                db.ref('tablet_speech').set({ text: txt, t: Date.now() });
                document.getElementById('txt').value = "";
            }
        }
    </script>
</body>
</html>
