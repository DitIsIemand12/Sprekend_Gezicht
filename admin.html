<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Admin - Final Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e1e1e; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid #333; text-align: center; margin-bottom: 20px; }
        #login-screen { display: block; }
        #admin-panel { display: none; }
        h2 { margin-top: 0; color: #ff9500; }
        h3 { color: #666; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 25px; }
        input { width: 100%; padding: 18px; background: #252525; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 18px; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        button { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.2s; text-transform: uppercase; }
        button:active { transform: scale(0.96); }
        .btn-login { background: #ff9500; color: #000; }
        .btn-angry { background: #300; color: #f44; border: 1px solid #f44; }
        .btn-slurp { background: #030; color: #0f0; border: 1px solid #0f0; }
        .btn-blij { background: #002244; color: #0088ff; border: 1px solid #0088ff; }
        .btn-special { background: #444; color: #fff; border: 1px dotted #888; }
        .btn-dead { background: #000; color: #aaa; border: 2px solid #555; }
        .btn-speak { background: #fff; color: #000; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Systeem Lock</h2>
        <input type="password" id="passInput" placeholder="Wachtwoord...">
        <button class="btn-login" onclick="tryLogin()">Ontgrendelen</button>
    </div>

    <div id="admin-panel" class="card">
        <h3>Normale Modi</h3>
        <button class="btn-angry" onclick="setEmo('angry')">Enge Tablet</button>
        <button class="btn-slurp" onclick="setEmo('slurpen')">Energie Slurpen</button>
        <button class="btn-blij" onclick="setEmo('super-blij')">Super Blij</button>

        <h3>Speciale Acties</h3>
        <button class="btn-special" onclick="setEmo('hidden')">Verdwijnen (Val omlaag)</button>
        <button class="btn-dead" onclick="setEmo('dead')">Uitschakelen (Dood)</button>

        <h3>Spreken</h3>
        <input type="text" id="speechText" placeholder="Typ je tekst..." autocomplete="off">
        <button class="btn-speak" onclick="say()">Verstuur Spraak</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let authKey = "";

        function tryLogin() {
            const input = document.getElementById('passInput').value;
            db.ref('password').set(input).then(() => {
                authKey = input;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            }).catch(err => { alert("Fout!"); });
        }

        function setEmo(emo) {
            db.ref('/').update({ "password": authKey, "tablet_emotion": emo });
        }

        function say() {
            const txt = document.getElementById('speechText').value;
            if(txt) {
                db.ref('/').update({ "password": authKey, "tablet_speech": { text: txt, time: Date.now() } });
                document.getElementById('speechText').value = "";
            }
        }
    </script>
</body>
</html>
