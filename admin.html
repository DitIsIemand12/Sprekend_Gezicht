<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Master Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #eee; padding: 20px; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
        button { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-red { background: #ff3b30; color: #fff; }
        .btn-blue { background: #007aff; color: #fff; }
        .btn-black { background: #000; color: #fff; border: 2px solid #0f0; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 18px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Gezicht Besturing</h3>
        <button class="btn-red" onclick="setEmo('angry')">STANDAARD (Boos)</button>
        <button class="btn-black" onclick="setEmo('slurpen')">START SLURPEN (Richting hoek)</button>
        <button class="btn-blue" onclick="setEmo('super-blij')">SUPER BLIJ (Overwinning)</button>
    </div>

    <div class="card">
        <h3>Spreken</h3>
        <input type="text" id="t" placeholder="Typ je tekst...">
        <button style="background: #34c759; color: white; margin-top: 10px;" onclick="say()">STUUR NAAR TV</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        function setEmo(e) { db.ref('tablet_emotion').set(e); }
        function say() {
            const v = document.getElementById('t').value;
            if(v) {
                db.ref('tablet_speech').set({ text: v, time: Date.now() });
                document.getElementById('t').value = "";
            }
        }
    </script>
</body>
</html>
