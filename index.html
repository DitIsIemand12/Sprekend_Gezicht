<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>iPad Karakter - Pro Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent: #ff0000;
            --eye-bg: #ffffff;
            --pupil: #000000;
            --glow: rgba(255, 0, 0, 0.4);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-color); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            transition: background 1s ease; font-family: sans-serif;
        }

        /* De container die over het scherm beweegt */
        #character-wrapper {
            position: absolute;
            display: flex; flex-direction: column; align-items: center;
            transition: all 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            width: 500px;
        }

        /* Oog Sectie */
        .eyes-container { display: flex; gap: 40px; margin-bottom: 40px; }
        
        .eyebrow {
            position: absolute; width: 140px; height: 30px; 
            background: var(--accent); top: -40px; border-radius: 20px;
            transition: all 0.4s ease; box-shadow: 0 0 15px var(--glow);
        }

        .eye { 
            width: 160px; height: 160px; background: var(--eye-bg); 
            border-radius: 50%; position: relative; overflow: hidden;
            box-shadow: 0 0 40px var(--glow); transition: 0.4s;
        }

        .pupil { 
            width: 60px; height: 60px; background: var(--pupil); 
            border-radius: 50%; position: absolute; top: 50px; left: 50px; 
            transition: transform 0.1s linear;
        }

        /* Mond */
        .mouth { 
            width: 250px; height: 20px; background: var(--accent); 
            border-radius: 50px; box-shadow: 0 0 30px var(--glow);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- MODUS: ANGRY --- */
        .angry .eyebrow.left { transform: rotate(15deg) translateY(20px); }
        .angry .eyebrow.right { transform: rotate(-15deg) translateY(20px); }

        /* --- MODUS: SLURPEN (Rechteronderhoek) --- */
        .slurpen { --bg-color: #1a0000; }
        .slurpen #character-wrapper {
            transform: translate(35vw, 30vh) scale(0.6);
            animation: vibrate 0.1s infinite;
        }
        .slurpen .mouth { 
            height: 150px; width: 150px; border-radius: 50%; 
            background: #000; border: 10px solid red;
            box-shadow: 0 0 60px red;
            animation: pulse-mouth 0.5s infinite alternate;
        }

        /* --- MODUS: SUPER-BLIJ --- */
        .super-blij { --bg-color: #007AFF; --accent: #fff; --glow: rgba(255,255,255,0.6); --pupil: #0044ff; }
        .super-blij .eyebrow { transform: translateY(-20px) rotate(0deg); height: 15px; }
        .super-blij .mouth { height: 120px; border-radius: 10px 10px 150px 150px; }

        /* Animaties */
        @keyframes vibrate { 0% { margin-left: 0; } 100% { margin-left: 5px; } }
        @keyframes pulse-mouth { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .blink .eye { transform: scaleY(0.05); }

        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; color: red; display: flex; 
            justify-content: center; align-items: center; z-index: 999;
            cursor: pointer; font-size: 24px; font-weight: bold;
        }
    </style>
</head>
<body class="angry">

    <div id="overlay" onclick="startApp()">[ SYSTEEM INITIALISEREN... ]</div>

    <div id="character-wrapper">
        <div class="eyes-container">
            <div class="eye">
                <div class="eyebrow left"></div>
                <div class="pupil" id="p1"></div>
            </div>
            <div class="eye">
                <div class="eyebrow right"></div>
                <div class="pupil" id="p2"></div>
            </div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            
            db.ref('tablet_emotion').on('value', (snapshot) => {
                const emo = snapshot.val();
                if(emo) document.body.className = emo;
            });

            db.ref('tablet_speech').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) speak(data.text);
            });
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'nl-NL';
            
            const isHappy = document.body.classList.contains('super-blij');
            utter.pitch = isHappy ? 1.4 : 0.2;
            utter.rate = isHappy ? 1.1 : 0.8;

            utter.onstart = () => {
                this.talkInterval = setInterval(() => {
                    const baseHeight = document.body.classList.contains('super-blij') ? 120 : 20;
                    const randomMod = Math.random() * 60;
                    document.getElementById('mouth').style.height = (baseHeight + randomMod) + "px";
                }, 80);
            };
            utter.onend = () => {
                clearInterval(this.talkInterval);
                const isSucking = document.body.classList.contains('slurpen');
                const isHappyEnd = document.body.classList.contains('super-blij');
                if (isSucking) document.getElementById('mouth').style.height = "150px";
                else if (isHappyEnd) document.getElementById('mouth').style.height = "120px";
                else document.getElementById('mouth').style.height = "20px";
            };
            synth.speak(utter);
        }

        // Ogen bewegen (pupillen volgen)
        setInterval(() => {
            const x = (Math.random() * 60) - 30;
            const y = (Math.random() * 60) - 30;
            document.getElementById('p1').style.transform = `translate(${x}px, ${y}px)`;
            document.getElementById('p2').style.transform = `translate(${x}px, ${y}px)`;
        }, 2500);

        // Knipperen
        setInterval(() => {
            document.body.classList.add('blink');
            setTimeout(() => document.body.classList.remove('blink'), 150);
        }, 4000);
    </script>
</body>
</html>
