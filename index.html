<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>iPad Pro - Sound & Sync Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000; --accent: #ff0000; --glow: rgba(255,0,0,0.6);
            --m-x: 0px; --m-y: 0px; --m-h: 40px; --m-w: 450px;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; transition: background 0.5s; }
        
        #face-wrapper { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; transform: scale(1.2); transition: all 0.5s ease; }
        #particle-canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

        .eyes { display: flex; gap: 80px; margin-bottom: 50px; }
        .eye { width: 250px; height: 250px; background: #fff; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 60px var(--glow); transition: 0.4s; }
        .eyebrow { position: absolute; width: 130%; height: 80px; background: var(--bg); top: -30px; left: -15%; transition: 0.4s; z-index: 2; }
        .pupil { position: absolute; width: 100px; height: 100px; background: #000; border-radius: 50%; top: 75px; left: 75px; transition: 0.1s; }

        .mouth { 
            width: var(--m-w); height: var(--m-h); background: var(--accent); border-radius: 100px; 
            box-shadow: 0 0 50px var(--glow); transform: translate(var(--m-x), var(--m-y)); 
            transition: width 0.4s, height 0.08s, transform 0.6s, border-radius 0.4s;
        }

        /* MODI */
        .angry .eyebrow.l { transform: rotate(22deg) translateY(65px); }
        .angry .eyebrow.r { transform: rotate(-22deg) translateY(65px); }

        .slurpen { --bg: #000; --m-x: 200px; --m-y: 80px; --m-h: 250px; --m-w: 250px; --accent: #000; }
        .slurpen .mouth { border: 15px solid #0f0; box-shadow: 0 0 100px #0f0; border-radius: 50%; }
        .slurpen .pupil { transform: translate(50px, 40px) scale(1.2); }

        .super-blij { --bg: #0070f3; --accent: #fff; --glow: rgba(255,255,255,0.8); --m-h: 180px; --m-w: 550px; }
        .super-blij .mouth { border-radius: 20px 20px 250px 250px; }
        .super-blij .eyebrow { transform: translateY(-80px); }
        .super-blij .pupil { background: #0044ff; }

        @keyframes suck { from { transform: translate(200px, 80px) scale(0.95); } to { transform: translate(200px, 80px) scale(1.05); } }
        .slurpen .mouth { animation: suck 0.2s infinite alternate; }
        .blink .eye { transform: scaleY(0.05); }
        #overlay { position: fixed; inset: 0; background: #000; color: #0f0; display: flex; justify-content: center; align-items: center; z-index: 1000; cursor: pointer; font-size: 30px; font-weight: bold; font-family: monospace; }
    </style>
</head>
<body class="angry">

    <div id="overlay" onclick="startApp()">[ SYSTEEM BOOTEN ]</div>
    
    <canvas id="particle-canvas"></canvas>

    <div id="face-wrapper">
        <div class="eyes">
            <div class="eye"><div class="eyebrow l"></div><div class="pupil" id="p1"></div></div>
            <div class="eye"><div class="eyebrow r"></div><div class="pupil" id="p2"></div></div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>

    <!-- Slurp Audio Element -->
    <audio id="slurpSound" loop src="slurp.mp3"></audio>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const slurpAudio = document.getElementById('slurpSound');
        let particles = [];
        let isSucking = false;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class EnergyWisp {
            constructor() { this.reset(); }
            reset() {
                this.x = canvas.width + Math.random() * 500;
                this.y = canvas.height + Math.random() * 500;
                this.size = Math.random() * 8 + 4;
                this.history = [];
                this.speed = Math.random() * 0.1 + 0.05;
                this.color = Math.random() > 0.2 ? '#0f0' : '#fff';
            }
            update(tx, ty) {
                this.history.push({x: this.x, y: this.y});
                if(this.history.length > 10) this.history.shift();
                this.x += (tx - this.x) * this.speed;
                this.y += (ty - this.y) * this.speed;
                if (Math.hypot(tx - this.x, ty - this.y) < 15) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                for(let i = this.history.length-1; i>=0; i--) { ctx.lineTo(this.history[i].x, this.history[i].y); }
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2); ctx.fill();
            }
        }

        for(let i=0; i<60; i++) particles.push(new EnergyWisp());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isSucking) {
                const mPos = document.getElementById('mouth').getBoundingClientRect();
                const tx = mPos.left + mPos.width / 2;
                const ty = mPos.top + mPos.height / 2;
                particles.forEach(p => { p.update(tx, ty); p.draw(); });
            }
            requestAnimationFrame(animate);
        }
        animate();

        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            db.ref('tablet_emotion').on('value', snap => {
                const emo = snap.val() || 'angry';
                document.body.className = emo;
                isSucking = (emo === 'slurpen');
                
                // Audio beheer
                if (isSucking) {
                    slurpAudio.play().catch(e => console.log("Klik eerst op het scherm!"));
                } else {
                    slurpAudio.pause();
                    slurpAudio.currentTime = 0;
                }
                
                document.getElementById('mouth').style.height = "";
            });
            db.ref('tablet_speech').on('value', snap => {
                const data = snap.val();
                if(data) speak(data.text);
            });
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'nl-NL';

            // Stem-profiel instellen op basis van emotie
            const currentEmo = document.body.className;
            if (currentEmo === 'super-blij') {
                utter.pitch = 1.5;  // Vrolijk hoog
                utter.rate = 1.1;   // Iets sneller
            } else if (currentEmo === 'angry' || currentEmo === 'slurpen') {
                utter.pitch = 0.2;  // Enge lage stem
                utter.rate = 0.8;   // Traag en dreigend
            }

            utter.onboundary = (event) => {
                if (document.body.className === 'slurpen') return;
                const m = document.getElementById('mouth');
                let baseH = document.body.className === 'super-blij' ? 180 : 40;
                // Hap beweging
                m.style.height = (baseH + Math.random() * 90) + "px";
                setTimeout(() => {
                    m.style.height = baseH + "px";
                }, 100);
            };

            utter.onend = () => { 
                document.getElementById('mouth').style.height = ""; 
            };
            
            synth.speak(utter);
        }

        setInterval(() => {
            if (!isSucking) {
                const x = (Math.random()*40 - 20) + 75; const y = (Math.random()*40 - 20) + 75;
                document.getElementById('p1').style.left = x + "px"; document.getElementById('p1').style.top = y + "px";
                document.getElementById('p2').style.left = x + "px"; document.getElementById('p2').style.top = y + "px";
            }
        }, 2000);
        setInterval(() => { document.body.classList.add('blink'); setTimeout(() => document.body.classList.remove('blink'), 150); }, 4500);
    </script>
</body>
</html>
