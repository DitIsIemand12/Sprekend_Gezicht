<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Geredde Tablet - TV</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: all 1s ease; }
        .screen { display: flex; flex-direction: column; align-items: center; transition: transform 0.5s; }
        
        /* Ogen basis */
        .eyes { display: flex; margin-bottom: 60px; }
        .eye { width: 180px; height: 120px; background: #f00; border-radius: 50%; box-shadow: 0 0 50px #f00; position: relative; margin: 0 40px; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .eye::before { content: ''; position: absolute; top: -50px; left: -20px; width: 220px; height: 100px; background: #000; transition: all 0.6s; }
        
        /* Mond basis */
        .mouth { width: 300px; height: 20px; background: #f00; border-radius: 50%; box-shadow: 0 0 40px #f00; transition: all 0.6s; }

        /* --- DE "SUPER BLIJ" MODUS (GEEN ROOD MEER!) --- */
        body.super-blij { background: #87CEEB; /* Hemelsblauw */ }
        
        .super-blij .eye { 
            background: #fff; /* Witte ogen */
            box-shadow: 0 0 30px rgba(255,255,255,0.8); 
            height: 160px; 
            width: 160px;
            transform: scale(1.1);
        }
        
        /* Weg met de boze wenkbrauwen in blij-modus */
        .super-blij .eye::before { transform: translateY(-150px); } 

        .super-blij .mouth { 
            width: 350px; 
            height: 150px; 
            background: #fff; /* Witte lach */
            border-radius: 0 0 175px 175px; /* Diepe boog naar beneden */
            box-shadow: 0 10px 30px rgba(255,255,255,0.5);
        }

        /* --- ANDERE EMOTIES (BOOS) --- */
        .angry .eye::before { transform: translateY(40px) rotate(20deg); }
        .angry .right::before { transform: translateY(40px) rotate(-20deg); }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; font-family: sans-serif; }
        .blink .eye { height: 5px !important; }
    </style>
</head>
<body id="body">

    <div id="overlay" onclick="startApp()">KLIK OM TE STARTEN</div>

    <div class="screen" id="face-container">
        <div class="eyes">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>

    <script>
        // Jouw Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAGvUwRjfQQ0QSh2S4n6mGf8k7sZlBggEs",
            authDomain: "tradingpost-57b20.firebaseapp.com",
            databaseURL: "https://tradingpost-57b20-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tradingpost-57b20",
            storageBucket: "tradingpost-57b20.firebasestorage.app",
            messagingSenderId: "358205969306",
            appId: "1:358205969306:web:3262822209994843fca023"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            
            db.ref('tablet_speech').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.text) praat(data.text);
            });

            db.ref('tablet_emotion').on('value', (snapshot) => {
                const emotion = snapshot.val();
                document.getElementById('body').className = emotion;
                document.getElementById('face-container').className = "screen " + emotion;
            });
        }

        function praat(tekst) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(tekst);
            utterance.lang = 'nl-NL';
            
            // Als we blij zijn, praat hij vrolijker (hogere pitch)
            if (document.body.classList.contains('super-blij')) {
                utterance.pitch = 1.3;
                utterance.rate = 1.1;
            } else {
                utterance.pitch = 0.3;
                utterance.rate = 0.8;
            }

            utterance.onstart = () => {
                this.mouthInterval = setInterval(() => {
                    let m = document.getElementById('mouth');
                    if(document.body.classList.contains('super-blij')) {
                        m.style.height = (Math.random() * 50 + 130) + "px"; // Mond beweegt terwijl hij lacht
                    } else {
                        m.style.height = (Math.random() * 100 + 20) + "px";
                    }
                }, 100);
            };
            utterance.onend = () => {
                clearInterval(this.mouthInterval);
                document.getElementById('mouth').style.height = document.body.classList.contains('super-blij') ? "150px" : "20px";
            };
            synth.speak(utterance);
        }

        setInterval(() => {
            document.body.classList.add('blink');
            setTimeout(() => document.body.classList.remove('blink'), 150);
        }, 4000);
    </script>
</body>
</html>
