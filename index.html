<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>iPad Karakter - Live Face</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color: #050505; --face-color: #ff0000; --glow-color: rgba(255, 0, 0, 0.5); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); overflow: hidden; display: flex; justify-content: center; align-items: center; transition: all 0.8s ease; font-family: sans-serif; }
        .eye { width: 180px; height: 180px; background: white; border-radius: 50%; position: relative; display: inline-block; margin: 30px; box-shadow: 0 0 40px var(--glow-color); }
        .pupil { width: 70px; height: 70px; background: black; border-radius: 50%; position: absolute; top: 55px; left: 55px; transition: 0.1s; }
        .mouth { width: 300px; height: 20px; background: var(--face-color); border-radius: 40px; margin-top: 50px; box-shadow: 0 0 30px var(--glow-color); transition: 0.3s; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; color: red; display: flex; justify-content: center; align-items: center; z-index: 999; cursor: pointer; font-size: 24px; }
        
        /* Modus voor blij */
        .super-blij { --bg-color: #007AFF; --face-color: #fff; --glow-color: rgba(255, 255, 255, 0.8); }
        .super-blij .mouth { height: 120px; border-radius: 20px 20px 150px 150px; }
    </style>
</head>
<body class="angry">

    <div id="overlay" onclick="startApp()">[ KLIK OM SYSTEEM TE STARTEN ]</div>

    <div style="text-align: center;">
        <div class="eye"><div class="pupil" id="p1"></div></div>
        <div class="eye"><div class="pupil" id="p2"></div></div>
        <div class="mouth" id="mouth"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
            authDomain: "scouting-3886b.firebaseapp.com",
            databaseURL: "https://scouting-3886b-default-rtdb.firebaseio.com",
            projectId: "scouting-3886b",
            storageBucket: "scouting-3886b.firebasestorage.app",
            messagingSenderId: "512534815557",
            appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            
            // Luister naar emotie
            db.ref('tablet_emotion').on('value', (snapshot) => {
                const emo = snapshot.val();
                if(emo) document.body.className = emo;
            });

            // Luister naar tekst
            db.ref('tablet_speech').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) speak(data.text);
            });
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'nl-NL';
            
            utter.onstart = () => {
                this.talkInterval = setInterval(() => {
                    const h = Math.random() * 60 + 20;
                    document.getElementById('mouth').style.height = h + "px";
                }, 100);
            };
            utter.onend = () => {
                clearInterval(this.talkInterval);
                const isHappy = document.body.classList.contains('super-blij');
                document.getElementById('mouth').style.height = isHappy ? "120px" : "20px";
            };
            synth.speak(utter);
        }

        // Ogen bewegen
        setInterval(() => {
            const x = Math.random() * 40 + 20;
            const y = Math.random() * 40 + 20;
            document.getElementById('p1').style.left = x + "px";
            document.getElementById('p1').style.top = y + "px";
            document.getElementById('p2').style.left = x + "px";
            document.getElementById('p2').style.top = y + "px";
        }, 2000);
    </script>
</body>
</html>
