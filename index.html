<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>iPad Pro - Mega Energy Stream</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000; --accent: #ff0000; --glow: rgba(255,0,0,0.6);
            --m-x: 0px; --m-y: 0px; --m-h: 30px; --m-w: 450px; --m-r: 100px;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; transition: background 0.8s; }
        
        /* Canvas voor de vette effecten */
        #particle-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

        #face-wrapper { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; transform: scale(1.2); transition: all 0.5s ease; }

        .eyes { display: flex; gap: 80px; margin-bottom: 40px; }
        .eye { width: 250px; height: 250px; background: #fff; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 60px var(--glow); transition: 0.4s; }
        .eyebrow { position: absolute; width: 130%; height: 60px; background: var(--bg); top: -20px; left: -15%; transition: 0.4s; z-index: 2; }
        .pupil { position: absolute; width: 90px; height: 90px; background: #000; border-radius: 50%; top: 80px; left: 80px; transition: 0.15s ease-out; }

        .mouth { 
            width: var(--m-w); height: var(--m-h); background: var(--accent); border-radius: var(--m-r); 
            box-shadow: 0 0 40px var(--glow); transform: translate(var(--m-x), var(--m-y)); 
            transition: width 0.4s, height 0.15s, transform 0.6s, border-radius 0.4s, background 0.4s; 
        }

        /* MODI */
        .angry .eyebrow.l { transform: rotate(20deg) translateY(60px); }
        .angry .eyebrow.r { transform: rotate(-20deg) translateY(60px); }

        .slurpen { --bg: #050a00; --m-x: 200px; --m-y: 150px; --m-h: 200px; --m-w: 200px; --m-r: 50%; --accent: #000; }
        .slurpen .mouth { border: 12px solid #0f0; box-shadow: 0 0 80px #0f0; animation: suck-pulse 0.2s infinite alternate; }
        .slurpen .pupil { transform: translate(50px, 50px); }

        .super-blij { --bg: #0066ff; --accent: #fff; --glow: rgba(255,255,255,0.8); --m-h: 180px; --m-w: 520px; --m-r: 20px 20px 220px 220px; }
        .super-blij .eyebrow { transform: translateY(-60px); }

        @keyframes suck-pulse { from { transform: translate(200px, 150px) scale(0.92); } to { transform: translate(200px, 150px) scale(1.08); } }
        .blink .eye { transform: scaleY(0.05); }
        #overlay { position: fixed; inset: 0; background: #000; color: #f00; display: flex; justify-content: center; align-items: center; z-index: 1000; cursor: pointer; font-size: 32px; font-weight: bold; font-family: monospace; text-transform: uppercase; }
    </style>
</head>
<body class="angry">

    <div id="overlay" onclick="startApp()">[ SYSTEEM BOOTEN... ]</div>
    <canvas id="particle-canvas"></canvas>

    <div id="face-wrapper">
        <div class="eyes">
            <div class="eye"><div class="eyebrow l"></div><div class="pupil" id="p1"></div></div>
            <div class="eye"><div class="eyebrow r"></div><div class="pupil" id="p2"></div></div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- ENERGIE PARTICLE ENGINE ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let isSucking = false;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class EnergyParticle {
            constructor() { this.reset(); }
            reset() {
                // Verschijnen in de rechteronderhoek, breed verspreid
                this.x = canvas.width + (Math.random() * 300);
                this.y = canvas.height + (Math.random() * 300);
                this.size = Math.random() * 10 + 2;
                this.speed = Math.random() * 0.04 + 0.02; // Willekeurige zuigkracht
                this.angle = Math.random() * Math.PI * 2;
                this.color = `hsla(${Math.random() * 40 + 100}, 100%, 60%, ${Math.random() * 0.5 + 0.5})`; // Tinten groen
            }
            update() {
                if (!isSucking) return;
                const mouthPos = document.getElementById('mouth').getBoundingClientRect();
                const tX = mouthPos.left + mouthPos.width / 2;
                const tY = mouthPos.top + mouthPos.height / 2;

                // Vloeibare beweging naar mond
                this.x += (tX - this.x) * this.speed;
                this.y += (tY - this.y) * this.speed;

                // Als het deeltje de mond raakt, reset
                if (Math.abs(this.x - tX) < 30 && Math.abs(this.y - tY) < 30) this.reset();
            }
            draw() {
                if (!isSucking) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        // Maak 250 deeltjes voor een volle stroom
        for(let i=0; i<250; i++) particles.push(new EnergyParticle());

        function animate() {
            // Dit zorgt voor de "trails" (vage achtergrond in plaats van volledig wissen)
            ctx.fillStyle = isSucking ? 'rgba(0, 10, 0, 0.2)' : 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(isSucking) {
                particles.forEach(p => { p.update(); p.draw(); });
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- FIREBASE LOGICA ---
        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            db.ref('tablet_emotion').on('value', snap => {
                const emo = snap.val() || 'angry';
                document.body.className = emo;
                isSucking = (emo === 'slurpen');
                
                // Reset mond naar CSS waarden
                document.getElementById('mouth').style.height = "";
            });
            db.ref('tablet_speech').on('value', snap => {
                const data = snap.val();
                if(data) speak(data.text);
            });
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'nl-NL';
            const emo = document.body.className;
            utter.pitch = emo === 'super-blij' ? 1.4 : 0.1;
            utter.rate = emo === 'super-blij' ? 1.0 : 0.75;

            utter.onstart = () => {
                this.talkInterval = setInterval(() => {
                    const currentEmo = document.body.className;
                    if (currentEmo === 'slurpen') return;
                    const m = document.getElementById('mouth');
                    let baseH = currentEmo === 'super-blij' ? 160 : 35;
                    m.style.height = (baseH + Math.random() * 80) + "px";
                }, 80);
            };
            utter.onend = () => {
                clearInterval(this.talkInterval);
                document.getElementById('mouth').style.height = "";
            };
            synth.speak(utter);
        }

        // Pupillen bewegen
        setInterval(() => {
            if (!isSucking) {
                const x = (Math.random()*40 - 20) + 80;
                const y = (Math.random()*40 - 20) + 80;
                document.getElementById('p1').style.left = x + "px";
                document.getElementById('p1').style.top = y + "px";
                document.getElementById('p2').style.left = x + "px";
                document.getElementById('p2').style.top = y + "px";
            }
        }, 2000);

        setInterval(() => {
            document.body.classList.add('blink');
            setTimeout(() => document.body.classList.remove('blink'), 150);
        }, 4500);
    </script>
</body>
</html>
