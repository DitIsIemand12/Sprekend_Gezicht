<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>iPad Pro - Expressive Happy Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000; --accent: #ff0000; --glow: rgba(255,0,0,0.6);
            --m-x: 0px; --m-y: 0px; --m-h: 40px; --m-w: 450px;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; transition: background 0.8s; }
        
        #face-wrapper { 
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 5; transform: scale(1.2) translateY(0); 
            transition: transform 1s cubic-bezier(0.47, 0, 0.745, 0.715), opacity 0.5s; 
        }

        .hidden #face-wrapper { transform: scale(1.2) translateY(150vh); opacity: 0; }

        .eyes { display: flex; gap: 80px; margin-bottom: 50px; }
        .eye { width: 250px; height: 250px; background: #fff; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 60px var(--glow); transition: 0.4s; }
        .eyebrow { position: absolute; width: 130%; height: 80px; background: var(--bg); top: -30px; left: -15%; transition: 0.4s; z-index: 2; }
        .pupil { position: absolute; width: 100px; height: 100px; background: #000; border-radius: 50%; top: 75px; left: 75px; transition: 0.1s; }

        .cross { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; justify-content: center; align-items: center; }
        .cross::before, .cross::after { content: ''; position: absolute; width: 20px; height: 150px; background: #000; border-radius: 10px; }
        .cross::before { transform: rotate(45deg); }
        .cross::after { transform: rotate(-45deg); }

        .mouth { 
            width: var(--m-w); height: var(--m-h); background: var(--accent); border-radius: 100px; 
            box-shadow: 0 0 50px var(--glow); transform: translate(var(--m-x), var(--m-y)); 
            transition: width 0.4s, height 0.05s, transform 0.6s, border-radius 0.4s;
        }

        /* MODI */
        .angry .eyebrow.l { transform: rotate(25deg) translateY(70px); }
        .angry .eyebrow.r { transform: rotate(-25deg) translateY(70px); }

        .slurpen { --bg: #000; --m-x: 200px; --m-y: 80px; --m-h: 250px; --m-w: 250px; --accent: #000; }
        .slurpen .mouth { border: 15px solid #0f0; box-shadow: 0 0 100px #0f0; border-radius: 50%; animation: suck 0.2s infinite alternate; }

        .super-blij { --bg: #00aaff; --accent: #fff; --glow: rgba(255,255,255,1); --m-h: 200px; --m-w: 550px; }
        .super-blij .mouth { border-radius: 20px 20px 250px 250px; box-shadow: 0 10px 60px #fff; }
        .super-blij .eyebrow { transform: translateY(-90px); }
        .super-blij .pupil { background: #0044ff; }

        .dead { --bg: #111; --accent: #444; --glow: none; }
        .dead .pupil { display: none; }
        .dead .cross { display: flex; }
        .dead .eye { background: #666; box-shadow: none; }
        .dead .mouth { height: 10px; width: 300px; opacity: 0.5; }

        /* Alleen trillen als boos, niet bij superblij */
        .angry.robot-vibrate #face-wrapper { animation: vibrate 0.1s infinite; }
        @keyframes vibrate { 0% { transform: scale(1.2) translate(2px, 2px); } 50% { transform: scale(1.2) translate(-2px, -2px); } 100% { transform: scale(1.2) translate(2px, -2px); } }
        
        @keyframes suck { from { transform: translate(200px, 80px) scale(0.95); } to { transform: translate(200px, 80px) scale(1.05); } }
        .blink .eye { transform: scaleY(0.05); }
        #overlay { position: fixed; inset: 0; background: #000; color: #0f0; display: flex; justify-content: center; align-items: center; z-index: 1000; cursor: pointer; font-size: 30px; font-weight: bold; font-family: monospace; }
        #particle-canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
</head>
<body class="angry">

    <div id="overlay" onclick="startApp()">[ SYSTEEM BOOTEN ]</div>
    <canvas id="particle-canvas"></canvas>
    
    <div id="face-wrapper">
        <div class="eyes">
            <div class="eye">
                <div class="eyebrow l"></div>
                <div class="pupil" id="p1"></div>
                <div class="cross"></div>
            </div>
            <div class="eye">
                <div class="eyebrow r"></div>
                <div class="pupil" id="p2"></div>
                <div class="cross"></div>
            </div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>
    
    <audio id="slurpSound" loop src="slurp.mp3"></audio>

  <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDk5QfCGtERCKw6m3fg5FlzEDEVoBU4SU0",
          authDomain: "scouting-3886b.firebaseapp.com",
          databaseURL: "https://scouting-3886b-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "scouting-3886b",
          storageBucket: "scouting-3886b.firebasestorage.app",
          messagingSenderId: "512534815557",
          appId: "1:512534815557:web:6d852b4fb27804813e942c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const slurpAudio = document.getElementById('slurpSound');
        const faceWrapper = document.getElementById('face-wrapper');
        let isSucking = false;
        
        // --- NIEUW: Geoptimaliseerd voor Windows (Edge / Chrome) ---
        let bestDutchVoice = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Zoek naar alle Nederlandse stemmen
            const dutchVoices = voices.filter(v => v.lang.includes('nl-NL'));
            
            if (dutchVoices.length > 0) {
                // 1. Zoek naar Microsoft Edge "Online" (Neural AI) stemmen (Beste kwaliteit)
                let premiumVoice = dutchVoices.find(v => v.name.includes('Online (Natural)'));
                
                // 2. Zoek naar Google Chrome stemmen
                if (!premiumVoice) {
                    premiumVoice = dutchVoices.find(v => v.name.includes('Google'));
                }
                
                // 3. Pak de standaard stem als we geen premium kunnen vinden
                bestDutchVoice = premiumVoice || dutchVoices[0];
            }
        }
        
        // Zorg dat de stemmen goed inladen (Browsers doen dit asynchroon)
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 
        // -----------------------------------------------------------

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class EnergyWisp {
            constructor() { this.reset(); }
            reset() { this.x = canvas.width + Math.random() * 500; this.y = canvas.height + Math.random() * 500; this.size = Math.random() * 8 + 4; this.history = []; this.speed = Math.random() * 0.1 + 0.05; this.color = Math.random() > 0.2 ? '#0f0' : '#fff'; }
            update(tx, ty) {
                this.history.push({x: this.x, y: this.y}); if(this.history.length > 10) this.history.shift();
                this.x += (tx - this.x) * this.speed; this.y += (ty - this.y) * this.speed;
                if (Math.hypot(tx - this.x, ty - this.y) < 15) this.reset();
            }
            draw() {
                ctx.beginPath(); ctx.moveTo(this.x, this.y);
                for(let i = this.history.length-1; i>=0; i--) { ctx.lineTo(this.history[i].x, this.history[i].y); }
                ctx.strokeStyle = this.color; ctx.lineWidth = this.size; ctx.lineCap = 'round'; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2); ctx.fill();
            }
        }
        let particles = Array.from({length: 60}, () => new EnergyWisp());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isSucking && !document.body.classList.contains('hidden')) {
                const mPos = document.getElementById('mouth').getBoundingClientRect();
                const tx = mPos.left + mPos.width / 2; const ty = mPos.top + mPos.height / 2;
                particles.forEach(p => { p.update(tx, ty); p.draw(); });
            }
            requestAnimationFrame(animate);
        }
        animate();

        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            db.ref('tablet_emotion').on('value', snap => {
                const emo = snap.val() || 'angry';
                document.body.className = emo;
                isSucking = (emo === 'slurpen');
                if (isSucking && !document.body.classList.contains('hidden')) slurpAudio.play(); else { slurpAudio.pause(); slurpAudio.currentTime = 0; }
                document.getElementById('mouth').style.height = "";
            });
            db.ref('tablet_speech').on('value', snap => {
                const data = snap.val(); if(data) speak(data.text);
            });
        }

        function speak(text) {
            const emo = document.body.className;
            if (emo === 'dead' || emo === 'hidden') return;
            
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'nl-NL';
            
            // Gebruik de premium Windows/Chrome stem
            if (bestDutchVoice) {
                utter.voice = bestDutchVoice;
            }
            
            // Natuurlijkere pitch (toonhoogte) en rate (snelheid)
            if (emo === 'super-blij') { 
                utter.pitch = 1.1;  // Iets hoger, klinkt vrolijker
                utter.rate = 1.1;   // Iets sneller
                document.body.classList.remove('robot-vibrate'); 
            } else { 
                utter.pitch = 0.8;  // Iets lager voor de stoere/enge modus
                utter.rate = 0.95;  // Net iets langzamer
                document.body.classList.add('robot-vibrate'); 
            }

            utter.onboundary = (event) => {
                if (document.body.className === 'slurpen') return;
                const m = document.getElementById('mouth');
                let isHappy = document.body.classList.contains('super-blij');
                let baseH = isHappy ? 200 : 40;
                
                let randomFactor = isHappy ? 160 : 120;
                m.style.height = (baseH + Math.random() * randomFactor) + "px";
                
                setTimeout(() => m.style.height = baseH + "px", isHappy ? 50 : 70);
            };

            utter.onend = () => { 
                document.getElementById('mouth').style.height = ""; 
                document.body.classList.remove('robot-vibrate'); 
            };
            
            synth.cancel(); 
            synth.speak(utter);
        }

        setInterval(() => { if (!isSucking && !document.body.classList.contains('dead')) { const x = (Math.random()*40 - 20) + 75; const y = (Math.random()*40 - 20) + 75; document.getElementById('p1').style.left = x + "px"; document.getElementById('p1').style.top = y + "px"; document.getElementById('p2').style.left = x + "px"; document.getElementById('p2').style.top = y + "px"; } }, 2000);
        setInterval(() => { if (!document.body.classList.contains('dead')) { document.body.classList.add('blink'); setTimeout(() => document.body.classList.remove('blink'), 150); } }, 4500);
    </script>
</body>
</html>
