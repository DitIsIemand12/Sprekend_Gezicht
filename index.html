<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Evil Tablet - TV</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: background 0.5s; }
        .screen { display: flex; flex-direction: column; align-items: center; transition: transform 0.3s; }
        
        /* Ogen */
        .eyes { display: flex; margin-bottom: 60px; }
        .eye { width: 180px; height: 120px; background: #f00; border-radius: 50%; box-shadow: 0 0 50px #f00; position: relative; margin: 0 40px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Wenkbrauwen / Oogleden */
        .eye::before { content: ''; position: absolute; top: -50px; left: -20px; width: 220px; height: 100px; background: #000; transition: all 0.4s; transform: translateY(0) rotate(0deg); }
        
        /* Mond */
        .mouth { width: 300px; height: 20px; background: #f00; border-radius: 50%; box-shadow: 0 0 40px #f00; transition: all 0.3s; }

        /* --- EMOTIES --- */
        
        /* BOOS */
        .angry .eye::before { transform: translateY(40px) rotate(20deg); }
        .angry .right::before { transform: translateY(40px) rotate(-20deg); }
        .angry .mouth { width: 200px; border-radius: 20% 20% 50% 50%; }

        /* BLIJ */
        .happy .eye { height: 140px; transform: scale(1.1); }
        .happy .eye::before { transform: translateY(-20px); }
        .happy .mouth { height: 100px; border-radius: 0 0 150px 150px; }

        /* GLITCH (Gestoord) */
        .glitch { animation: shake 0.1s infinite; background: #100; }
        .glitch .eye { background: #fff; box-shadow: 0 0 80px #fff; width: 100px; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #f00; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; font-family: 'Courier New', monospace; font-size: 20px; }
        .blink .eye { height: 5px !important; }
    </style>
</head>
<body id="body">

    <div id="overlay" onclick="startApp()">[ SYSTEEM INITIALISEREN... KLIK HIER ]</div>

    <div class="screen" id="face-container">
        <div class="eyes">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGvUwRjfQQ0QSh2S4n6mGf8k7sZlBggEs",
            authDomain: "tradingpost-57b20.firebaseapp.com",
            databaseURL: "https://tradingpost-57b20-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tradingpost-57b20",
            storageBucket: "tradingpost-57b20.firebasestorage.app",
            messagingSenderId: "358205969306",
            appId: "1:358205969306:web:3262822209994843fca023"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- ELEVENLABS INSTELLINGEN (OPTIONEEL) ---
        const ELEVENLABS_API_KEY = ""; // Plak hier je key voor een superstem
        const VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Voorbeeld: 'Adam' stem

        function startApp() {
            document.getElementById('overlay').style.display = 'none';
            
            // Luister naar spraak
            db.ref('tablet_speech').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.text) praat(data.text);
            });

            // Luister naar emoties
            db.ref('tablet_emotion').on('value', (snapshot) => {
                const emotion = snapshot.val();
                document.getElementById('body').className = emotion;
                document.getElementById('face-container').className = "screen " + emotion;
            });
        }

        async function praat(tekst) {
            // Als er een ElevenLabs key is, gebruik die. Anders fallback naar browser.
            if (ELEVENLABS_API_KEY !== "") {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVENLABS_API_KEY },
                    body: JSON.stringify({ text: tekst, voice_settings: { stability: 0.5, similarity_boost: 0.5 } })
                });
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                
                audio.onplay = () => startMouthAnim();
                audio.onended = () => stopMouthAnim();
                audio.play();
            } else {
                // Browser Stem Fallback
                const synth = window.speechSynthesis;
                const utterance = new SpeechSynthesisUtterance(tekst);
                utterance.lang = 'nl-NL';
                utterance.pitch = 0.3;
                utterance.onstart = startMouthAnim;
                utterance.onend = stopMouthAnim;
                synth.speak(utterance);
            }
        }

        let mouthInterval;
        function startMouthAnim() {
            mouthInterval = setInterval(() => {
                document.getElementById('mouth').style.height = (Math.random() * 120 + 20) + "px";
            }, 100);
        }
        function stopMouthAnim() {
            clearInterval(mouthInterval);
            document.getElementById('mouth').style.height = "20px";
        }

        setInterval(() => {
            document.body.classList.add('blink');
            setTimeout(() => document.body.classList.remove('blink'), 150);
        }, 4000);
    </script>
</body>
</html>
